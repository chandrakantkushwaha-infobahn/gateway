server.port=8084
spring.application.name=gateway

# Eureka Client Config
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
# Register & Fetch
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# Instance Config
eureka.instance.prefer-ip-address=true

# Zipkin
management.tracing.sampling.probability=1.0

# Gateway Routes - Company MS
spring.cloud.gateway.routes[0].id=companyms
spring.cloud.gateway.routes[0].uri=lb://COMPANYMS-SERVICE
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/company/**
spring.cloud.gateway.routes[0].filters[0]=RewritePath=/api/company(?<segment>/?.*), /company$\{segment}
spring.cloud.gateway.routes[0].filters[1].name=CircuitBreaker
spring.cloud.gateway.routes[0].filters[1].args.name=companyCircuitBreaker

# Gateway Routes - Job MS
spring.cloud.gateway.routes[1].id=jobms
spring.cloud.gateway.routes[1].uri=lb://JOBMS-SERVICE
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/jobs/**
spring.cloud.gateway.routes[1].filters[0]=RewritePath=/api/jobs(?<segment>/?.*), /jobs$\{segment}
spring.cloud.gateway.routes[1].filters[1].name=CircuitBreaker
spring.cloud.gateway.routes[1].filters[1].args.name=jobCircuitBreaker

# Gateway Routes - Review MS
spring.cloud.gateway.routes[2].id=reviewms
spring.cloud.gateway.routes[2].uri=lb://REVIEWMS-SERVICE
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/review/**
spring.cloud.gateway.routes[2].filters[0]=RewritePath=/api/review(?<segment>/?.*), /review$\{segment}
spring.cloud.gateway.routes[2].filters[1].name=CircuitBreaker
spring.cloud.gateway.routes[2].filters[1].args.name=reviewCircuitBreaker

# Gateway Routes - eureka //http://localhost:8084/api/eureka/main
spring.cloud.gateway.routes[3].id=eureka
spring.cloud.gateway.routes[3].uri=http://localhost:8761
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/eureka/main
spring.cloud.gateway.routes[3].filters[0]=RewritePath=/api/eureka/main, /

#eureka-ui http://localhost:8084/api/eureka/main
spring.cloud.gateway.routes[4].id=eureka-ui
spring.cloud.gateway.routes[4].uri=http://localhost:8761
spring.cloud.gateway.routes[4].predicates[0]=Path=/eureka/**

#logging
logging.level.root=info
logging.level.org.springframework.cloud.gateway.route.RootdefinationLocator=INFO
logging.level.org.springframework.cloud.gateway=TRACE

# Actuator
management.endpoints.web.exposure.include=health,info,metrics,gateway,circuitbreakers,circuitbreakerevents
management.endpoint.health.show-details=always
management.endpoint.circuitbreakers.enabled=true
management.endpoint.circuitbreakerevents.enabled=true

# Resilience4j circuit breaker health indicators
resilience4j.circuitbreaker.instances.companyCircuitBreaker.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.companyCircuitBreaker.slidingWindowSize=10
resilience4j.circuitbreaker.instances.companyCircuitBreaker.slidingWindowType=COUNT_BASED
resilience4j.circuitbreaker.instances.companyCircuitBreaker.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.companyCircuitBreaker.permittedNumberOfCallsInHalfOpenState=3
resilience4j.circuitbreaker.instances.companyCircuitBreaker.automaticTransitionFromOpenToHalfOpenEnabled=true
resilience4j.circuitbreaker.instances.companyCircuitBreaker.waitDurationInOpenState=5s
resilience4j.circuitbreaker.instances.companyCircuitBreaker.failureRateThreshold=50
resilience4j.circuitbreaker.instances.companyCircuitBreaker.slowCallRateThreshold=50
resilience4j.circuitbreaker.instances.companyCircuitBreaker.slowCallDurationThreshold=2s

resilience4j.circuitbreaker.instances.jobCircuitBreaker.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.jobCircuitBreaker.slidingWindowSize=10
resilience4j.circuitbreaker.instances.jobCircuitBreaker.slidingWindowType=COUNT_BASED
resilience4j.circuitbreaker.instances.jobCircuitBreaker.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.jobCircuitBreaker.permittedNumberOfCallsInHalfOpenState=3
resilience4j.circuitbreaker.instances.jobCircuitBreaker.automaticTransitionFromOpenToHalfOpenEnabled=true
resilience4j.circuitbreaker.instances.jobCircuitBreaker.waitDurationInOpenState=5s
resilience4j.circuitbreaker.instances.jobCircuitBreaker.failureRateThreshold=50

resilience4j.circuitbreaker.instances.reviewCircuitBreaker.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.reviewCircuitBreaker.slidingWindowSize=10
resilience4j.circuitbreaker.instances.reviewCircuitBreaker.slidingWindowType=COUNT_BASED
resilience4j.circuitbreaker.instances.reviewCircuitBreaker.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.reviewCircuitBreaker.permittedNumberOfCallsInHalfOpenState=3
resilience4j.circuitbreaker.instances.reviewCircuitBreaker.automaticTransitionFromOpenToHalfOpenEnabled=true
resilience4j.circuitbreaker.instances.reviewCircuitBreaker.waitDurationInOpenState=5s
resilience4j.circuitbreaker.instances.reviewCircuitBreaker.failureRateThreshold=50
